# Push a tag like v1.1.0 (matching "version" in package.json) to publish a GitHub release with the
# macOS DMG and the Windows zip attached.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write  # create the release and upload the builds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package.json
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || { echo "Tag $GITHUB_REF_NAME != v$VERSION in package.json"; exit 1; }
      - run: npm ci
      - name: Make sure the Electron binary downloaded
        run: '[ -d node_modules/electron/dist ] || node node_modules/electron/install.js'
      - name: Build macOS DMG and Windows zip
        run: npm run pack
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Notes are this version's CHANGELOG section.
          awk -v v="$VERSION" '/^## /{p = index($0, "## " v " ") == 1} p' CHANGELOG.md | tail -n +2 > notes.md
          mv dist/Ridgeline-RC-mac.dmg "dist/Ridgeline-RC-$VERSION-mac.dmg"
          mv dist/Ridgeline-RC-windows-x64.zip "dist/Ridgeline-RC-$VERSION-windows-x64.zip"
          gh release create "$GITHUB_REF_NAME" "dist/Ridgeline-RC-$VERSION-mac.dmg" "dist/Ridgeline-RC-$VERSION-windows-x64.zip" \
            --title "Ridgeline RC $VERSION" --notes-file notes.md
