<style>

</style>
<div class="wrap"><canvas id="game" width="960" height="600" tabindex="0" aria-label="Ridgeline RC racing game"></canvas></div>
<script>
'use strict';
// ===== Basics =====
const W = 960, H = 600, DT = 1 / 60, STEP = 8, MARGIN = 340, GRAV = 1100;
const TAU = Math.PI * 2;

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let scaleK = 1;
function fit() {

  cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
}
addEventListener('resize', fit); fit();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

const ord = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 > 10 && n % 100 < 14) || n % 10 > 3 ? 0 : n % 10]);
const today = () => new Date().toISOString().slice(0, 10);
const pick = a => a[Math.floor(Math.random() * a.length)];
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => f(v).toString(16).padStart(2, '0')).join('');

function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

function panel(x, y, w, h, a = 0.72) { ctx.save(); ctx.fillStyle = `rgba(12,15,22,${a})`; rr(ctx, x, y, w, h, 10); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }

// ===== Save data (scoreboard, career, settings) — localStorage, which Electron keeps in the app's userData folder =====
const SAVE_KEY = 'ridgeline-rc-save-v1';
const freshSave = () => ({ v: 1, name: 'ACE', settings: { music: true, sfx: true, voice: true, difficulty: 1 },
  career: { races: 0, wins: 0, podiums: 0, trials: 0, laps: 0, cupsPlayed: 0, cupsWon: 0, wipeouts: 0, boosts: 0, air: 0 }, tracks: {}, cups: [] });
let save = freshSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return;
    const d = JSON.parse(raw), f = freshSave();

  } catch (e) {}
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const trackRec = id => save.tracks[id] || (save.tracks[id] = { races: [], laps: [] });
const qualifies = (list, t) => isFinite(t) && (list.length < 5 || t < list[list.length - 1].t);

loadSave();

// ===== Tracks (original layouts) =====
const THEMES = {

  thunder: { grass: '#5c7448', grass2: '#687f52', grass3: '#50663f', road: '#4f535b', speck: '#5d626b', runoff: '#8d8a80', wall: '#1d1f24', wall2: '#c9c4b5', curbA: '#f2c23a', curbB: '#2a2a2a', dust: '#8d8a80', deco: ['rock', 'rock', 'pine', 'pine'] },

    boosts: [[0.08, 0], [0.5, -30], [0.78, 30]], jumps: [0.28, 0.66], oils: [[0.18, -25], [0.4, 30], [0.6, 0], [0.9, -30]], nitros: [[0.33, 30], [0.72, -30]] },
  { id: 'thunder', name: 'Thunder Ridge Run', laps: 3, half: 84, theme: 'thunder', seed: 37,
    pts: [[300, 650], [700, 260], [1300, 350], [1500, 760], [1900, 460], [2400, 600], [2460, 1220], [2000, 1620], [1500, 1360], [1100, 1720], [500, 1720], [240, 1200]],
    boosts: [[0.15, 30], [0.47, -30], [0.83, 0]], jumps: [0.25, 0.58], oils: [[0.1, 0], [0.36, -30], [0.7, 30], [0.92, -20]], nitros: [[0.3, 0], [0.64, 30]] },
  { id: 'mesa', name: 'Moonshine Mesa', laps: 3, half: 90, theme: 'mesa', seed: 41,
    pts: [[400, 300], [1100, 200], [1600, 450], [2300, 300], [2620, 800], [2200, 1120], [2500, 1620], [2000, 2020], [1400, 1720], [900, 2020], [350, 1820], [520, 1220], [200, 800]],
    boosts: [[0.07, -30], [0.42, 30], [0.75, 0]], jumps: [0.2, 0.52, 0.86], oils: [[0.14, 30], [0.33, -20], [0.6, 25], [0.8, -30]], nitros: [[0.27, 0], [0.68, -30]] },
];
const mod = (i, n) => ((i % n) + n) % n;
const trackCache = [];
function getTrack(ti) { return trackCache[ti] || (trackCache[ti] = buildTrack(TRACK_DEFS[ti])); }
function buildTrack(def) {

// Pre-renders the static ground of a track (grass, scenery, road, curbs, ramps, mud) into one canvas.
function ensureCanvas(T) {

function drawStand(g, st, r) {

    if (mud && sp > 60 && Math.random() < 0.6) { emit(R, { x: c.x, y: c.y, vx: (Math.random() - 0.5) * 140, vy: (Math.random() - 0.5) * 140, vz: 120 + Math.random() * 80, grav: 600, life: 0.5, size: 3, color: '#5a3d22' }); if (c === R.focus && Math.random() < 0.04) ev(R, c, 'mud'); }

function updateTires(R) {
  const T = R.T, dt = DT;
  R.tireT -= dt;

    const i = (R.focus.idx + 45 + Math.floor(Math.random() * 40)) % T.N, s = T.s[i], side = Math.random() < 0.5 ? -1 : 1, sp = 150 + Math.random() * 80;
    R.tires.push({ x: s.x + s.nx * side * (T.half + 34), y: s.y + s.ny * side * (T.half + 34), vx: -s.nx * side * sp + s.tx * (Math.random() - 0.5) * 80, vy: -s.ny * side * sp + s.ty * (Math.random() - 0.5) * 80,

    t.vz -= 900 * dt; t.z += t.vz * dt; if (t.z < 0) { t.z = 0; t.vz = Math.max(Math.abs(t.vz) * 0.55, 170); }

      const dx = c.x - t.x, dy = c.y - t.y, d = Math.hypot(dx, dy);

}

// Gameplay events → sound + announcer (only for the player, never in the attract-mode demo).
function ev(R, c, type) {
  if (type === 'boost' || type === 'turbo') { if (c === R.player) R.stats.boosts++; }
  if (R.demo || c !== R.player) { if (type === 'finish' && R.player && c !== R.player && R.finishOrder === 1) R.banner = { text: `${c.name} wins`, sub: 'Keep pushing!', t: 1.6 }; return; }
  const T = R.T;
  switch (type) {
    case 'turbo': sfx('turbo'); announce(pick(['Nitro!', 'Hit it!', 'Full throttle!']), 'turbo', 5); break;
    case 'boost': sfx('boost'); announce(pick(['Boost!', 'Speed pad!']), 'boost', 7); break;
    case 'jump': sfx('jump'); break;
    case 'land': sfx('land'); R.shake = Math.max(R.shake, 4); break;
    case 'bigair': announce(pick(['Big air!', 'Sky high!', 'Airborne!']), 'air', 6); break;
    case 'wall': sfx('wall'); R.shake = Math.max(R.shake, 3); break;
    case 'wallhard': sfx('wall'); R.shake = Math.max(R.shake, 7); announce(pick(['Ouch!', 'Into the wall!']), 'wall', 8); break;
    case 'oil': sfx('oil'); announce(pick(['Oil slick!', 'Slippery!', 'Whoa, oil!']), 'oil', 5); break;
    case 'tire': sfx('bonk'); R.shake = Math.max(R.shake, 7); announce(pick(['Loose wheel!', 'Wheel strike!', 'Watch that tire!']), 'tire', 5); break;
    case 'mud': sfx('mud'); break;
    case 'pickup': sfx('pickup'); announce('Nitro pickup!', 'pick', 6); break;
    case 'lap': sfx('lap'); R.banner = { text: `Lap ${c.done + 1}`, sub: `Last lap ${fmt(c.lapTimes[c.lapTimes.length - 1])}`, t: 1.6 }; announce(`Lap ${c.done + 1}`, 'lap', 0); break;
    case 'finallap': sfx('final'); R.banner = { text: 'Final lap!', sub: `Last lap ${fmt(c.lapTimes[c.lapTimes.length - 1])}`, t: 1.8 }; announce('Final lap!', 'lap', 0); break;
    case 'finish': {
      R.phase = 'done'; R.doneT = 3.8; stopSong();
      const pl = R.mode === 'trial' ? 0 : c.finishPlace;
      sfx(pl <= 3 ? 'fanfare' : 'sad');
      R.banner = { text: pl === 0 ? 'Finish!' : pl === 1 ? 'You win!' : `${ord(pl)} place`, sub: fmt(c.finishTime), t: 3.8, big: true };
      announce(pl === 0 ? 'Finished! Nice driving.' : pl === 1 ? 'Checkered flag! You win!' : pl === 4 ? 'Fourth place. Shake it off!' : `You finished ${ord(pl)}!`, 'fin', 0);

}

function updateRace(R) {
  const T = R.T, dt = DT;
  if (R.banner && (R.banner.t -= dt) <= 0) R.banner = null;
  if (R.phase === 'intro' && (R.phaseT -= dt) <= 0) { R.phase = 'count'; R.phaseT = 3; }
  if (R.phase === 'count') {
    R.phaseT -= dt; const n = Math.ceil(R.phaseT);
    if (n < R.cdShown && n >= 1) { R.cdShown = n; sfx('beep'); announce(['', 'One', 'Two', 'Three'][n], 'cd' + n, 0); }
    if (R.phaseT <= 0) { R.phase = 'go'; R.goT = 1; sfx('go'); announce('Go!', 'go', 0); playSong(RACE_SONG); }
  }
  const racing = R.phase === 'go' || R.phase === 'done';
  if (racing) R.time += dt;
  R.goT -= dt;
  for (const c of R.cars) {
    if (!racing) { if (c === R.player) { const i = readInput(); c.thr = lerp(c.thr, i.thr, 0.2); } continue; }
    const inp = c.ai || c.finished ? aiControl(R, c) : readInput();
    stepCar(R, c, inp);
  }
  // Car-to-car bumps.
  for (let a = 0; a < R.cars.length; a++) for (let b = a + 1; b < R.cars.length; b++) {
    const p = R.cars[a], q = R.cars[b], dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
    if (d > 0 && d < 26 && Math.abs(p.z - q.z) < 20) {
      const nx = dx / d, ny = dy / d, push = (26 - d) / 2; p.x -= nx * push; p.y -= ny * push; q.x += nx * push; q.y += ny * push;
      const rel = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
      if (rel < 0) { const j = -rel * 0.8; p.vx -= nx * j * 0.5; p.vy -= ny * j * 0.5; q.vx += nx * j * 0.5; q.vy += ny * j * 0.5; if ((p === R.player || q === R.player) && -rel > 70 && !R.demo) sfx('bump'); }
    }
  }
  if (racing) updateTires(R);
  for (const n of T.nitros) if (!n.on && (n.t -= dt) <= 0) n.on = true;
  for (let k = R.parts.length - 1; k >= 0; k--) {
    const p = R.parts[k]; p.life -= dt; if (p.life <= 0) { R.parts.splice(k, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96;

  // Standings.
  const sorted = [...R.cars].sort((a, b) => (a.finished && b.finished) ? a.finishPlace - b.finishPlace : a.finished ? -1 : b.finished ? 1 : b.prog - a.prog);
  sorted.forEach((c, i) => c.place = i + 1);
  if (R.demo) { R.focus = sorted[0]; return; }
  const P = R.player;
  if (racing && R.mode !== 'trial' && !P.finished && R.time > 2) {
    if (P.place < R.lastPlace && P.place === 1) announce('You take the lead!', 'pos', 4);
    else if (P.place > R.lastPlace && R.lastPlace === 1) announce('Lost the lead!', 'pos', 4);
    else if (P.place < R.lastPlace) announce(`Up to ${ord(P.place)}!`, 'pos', 4);
  }
  R.lastPlace = P.place;
  if (racing && !P.finished) {
    const s = T.s[P.idx], dot = P.vx * s.tx + P.vy * s.ty;
    R.wrongT = dot < -40 ? R.wrongT + dt : 0; if (R.wrongT > 1 && R.wrongT < 1 + dt * 1.5) announce('Wrong way!', 'wrong', 4);
  } else R.wrongT = 0;

  const sp = Math.hypot(P.vx, P.vy); engineUpdate(sp, P.thr, P.skid, P.boostT > 0);

}

// ===== Rendering: world =====
function drawRace(R, now) {
  const T = R.T, f = R.focus;
  const cx = clamp(R.camX, W / 2, T.w - W / 2), cy = clamp(R.camY, H / 2, T.h - H / 2);
  const sh = R.shake, ox = Math.round(clamp(cx - W / 2 + (Math.random() - 0.5) * sh, 0, T.w - W)), oy = Math.round(clamp(cy - H / 2 + (Math.random() - 0.5) * sh, 0, T.h - H));

  const vis = (x, y, m = 80) => x > ox - m && x < ox + W + m && y > oy - m && y < oy + H + m;
  const t = now / 1000;

    ctx.fillStyle = '#161a24'; rr(ctx, -24, -22, 48, 44, 6); ctx.fill(); ctx.strokeStyle = '#45e0ff'; ctx.lineWidth = 2; ctx.stroke();

  }

    ctx.save(); ctx.translate(n.x, n.y);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(3, 5, 10, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(120,240,255,${0.25 + 0.15 * Math.sin(t * 6)})`; ctx.beginPath(); ctx.arc(0, -8 + bob, 18, 0, TAU); ctx.fill();
    ctx.fillStyle = '#d23a2a'; rr(ctx, -7, -18 + bob, 14, 20, 4); ctx.fill(); ctx.fillStyle = '#f4efe2'; ctx.fillRect(-7, -11 + bob, 14, 5); ctx.fillStyle = '#9aa0aa'; ctx.fillRect(-3, -21 + bob, 6, 4);
    ctx.restore();
  }

}
function drawCar(c) {

    ctx.fillStyle = row.c.color; ctx.fillRect(cols[1], y - 16, 14, 14); text(row.c.name, cols[1] + 24, y, { size: 18, color: me ? '#ffd34d' : '#f4efe2' });
    text((row.est ? '~' : '') + fmt(row.time), cols[2], y, { size: 18 }); text(fmt(row.best), cols[3], y, { size: 18 }); if (cup) text(`+${row.pts}`, cols[4], y, { size: 18, align: 'right', color: '#7bd389' });
  });
  let y = 186 + r.rows.length * 46 + 14;
  if (r.newRace || r.newLap) { if (Math.floor(t * 3) % 2 === 0) text(`NEW ${r.newRace && r.newLap ? 'RACE + LAP' : r.newRace ? 'RACE' : 'LAP'} RECORD!`, W / 2, y + 10, { size: 26, align: 'center', color: '#ffd34d' }); y += 40; }
  const st = race.stats; text(`Wipeouts ${st.wipeouts} · Boosts ${st.boosts} · Air time ${st.air.toFixed(1)} s`, W / 2, y + 16, { size: 15, align: 'center', font: BODY, color: '#ccc' });
  text('Enter: continue', W / 2, H - 36, { size: 16, align: 'center', font: BODY, color: '#ffd34d' });
}
function drawBoard() {
  ctx.fillStyle = 'rgba(8,10,16,.78)'; ctx.fillRect(0, 0, W, H);
  const def = TRACK_DEFS[boardTrack], rec = trackRec(def.id);
  text('SCOREBOARD', W / 2, 54, { size: 32, align: 'center', color: '#ffd34d' });
  text(`< ${def.name.toUpperCase()} >`, W / 2, 92, { size: 18, align: 'center', color: '#9ff3ff' });
  const col = (x, title, list) => {
    panel(x, 110, 380, 230, 0.7); text(title, x + 190, 140, { size: 15, align: 'center', color: '#ffd34d' });
    if (!list.length) text('No times yet', x + 190, 220, { size: 15, align: 'center', font: BODY, color: '#999' });
    list.forEach((e, i) => { const y = 176 + i * 34; text(`${i + 1}.`, x + 20, y, { size: 15 }); text(e.n, x + 54, y, { size: 15, color: i === 0 ? '#ffd34d' : '#f4efe2' }); text(fmt(e.t), x + 200, y, { size: 15, align: 'right' }); text(`${e.d}${e.mode === 'trial' ? ' TT' : ''} ${e.at.slice(5)}`, x + 364, y, { size: 12, align: 'right', font: BODY, color: '#aaa' }); });
  };
  col(W / 2 - 395, 'FASTEST RACES', rec.races); col(W / 2 + 15, 'FASTEST LAPS', rec.laps);
  const C = save.career; panel(W / 2 - 395, 352, 790, 92, 0.7);
  text('CAREER', W / 2 - 375, 380, { size: 14, color: '#ffd34d' });
  text(`Races ${C.races} · Wins ${C.wins} · Podiums ${C.podiums} · Time trials ${C.trials} · Laps ${C.laps}`, W / 2 - 375, 406, { size: 15, font: BODY });
  text(`Cups ${C.cupsWon}/${C.cupsPlayed} won · Wipeouts ${C.wipeouts} · Boosts ${C.boosts} · Air time ${C.air.toFixed(1)} s`, W / 2 - 375, 430, { size: 15, font: BODY });
  panel(W / 2 - 395, 452, 790, 92, 0.7); text('CUP RESULTS', W / 2 - 375, 478, { size: 14, color: '#ffd34d' });
  if (!save.cups.length) text('Win the Ridgeline Cup to get your name here.', W / 2 - 375, 506, { size: 15, font: BODY, color: '#999' });
  save.cups.slice(0, 4).forEach((c, i) => text(`${ord(c.place)} ${c.n} ${c.p} pts ${c.d} ${c.at}`, W / 2 - 375 + (i % 2) * 395, 506 + Math.floor(i / 2) * 26, { size: 14, font: BODY, color: c.place === 1 ? '#ffd34d' : '#ddd' }));

}
function drawPause() {
  ctx.fillStyle = 'rgba(8,10,16,.6)'; ctx.fillRect(0, 0, W, H);
  panel(W / 2 - 160, 170, 320, 250, 0.9); text('PAUSED', W / 2, 220, { size: 32, align: 'center', color: '#ffd34d' });
  ['Resume', 'Restart race', 'Quit to menu'].forEach((l, i) => text((i === pauseSel ? '> ' : '  ') + l.toUpperCase(), W / 2, 280 + i * 40, { size: 18, align: 'center', color: i === pauseSel ? '#ffd34d' : '#f4efe2' }));
}

// ===== Main loop =====
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  pollPad();
  while (acc >= DT) { if (race && !(state === 'race' && paused)) updateRace(race); acc -= DT; }
  ctx.setTransform(scaleK, 0, 0, scaleK, 0, 0); ctx.imageSmoothingEnabled = true;
  if (race) drawRace(race, now);
  if (state === 'race' && race && !race.demo) { drawHUD(race); if (paused) drawPause(); }
  else drawScreen(now);
  drawCaption();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'race' && race && !race.demo && !paused) pause(); });
(document.fonts ? document.fonts.load(`700 20px ${DISP}`).catch(() => {}) : Promise.resolve()).then(() => { startDemo(); cv.focus(); requestAnimationFrame(frame); });
</script>
